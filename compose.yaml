services:
  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: njit_course_checker
      DB_USER: njit_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    container_name: njit-frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    environment:
      API_SCHEME: ${API_SCHEME:-http}
      TZ: America/New_York

  checker:
    build: .
    container_name: njit-course-checker
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy

    environment:
      CHECK_INTERVAL: ${CHECK_INTERVAL:-600}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      TZ: America/New_York

      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: njit_course_checker
      DB_USER: njit_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}

    volumes:
      - ./data:/app/data

  db:
    image: mariadb:lts
    container_name: njit-db
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MARIADB_DATABASE: njit_course_checker
      MARIADB_USER: njit_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      TZ: America/New_York

    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/migrations/001-sessions.sql:/docker-entrypoint-initdb.d/02-sessions.sql:ro
      - ./database/migrations/02-course-catalog.sql:/docker-entrypoint-initdb.d/03-course-catalog.sql:ro
      - ./database/migrations/03-cancelled-status.sql:/docker-entrypoint-initdb.d/04-cancelled-status.sql:ro

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mariadb_data:
