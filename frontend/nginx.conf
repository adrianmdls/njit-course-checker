server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ECS supplies the ALB subnet CIDRs. Compose trusts no forwarded client IPs.
    ${ALB_REAL_IP_DIRECTIVES}
    real_ip_header X-Forwarded-For;
    # The ALB appends the client address as the final entry.
    real_ip_recursive off;

    set $backend http://${API_UPSTREAM};

    location /api/ {
        resolver ${API_RESOLVER} valid=10s ipv6=off;
        # Preserve the original path and query, including escaping.
        proxy_pass $backend$request_uri;
        proxy_set_header Host ${API_HOST};
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto ${API_SCHEME};
        proxy_set_header X-Forwarded-Host ${API_HOST};
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Real-IP "";
        proxy_cache off;

        # Match Express's bounded 5 MiB parser only for checker ingestion.
        # Proxy headers/resolver are inherited; other API routes retain 1 MiB.
        location ~* ^/api/internal/sync/department/?$ {
            client_max_body_size 5m;
            proxy_pass $backend$request_uri;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
