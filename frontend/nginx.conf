server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto ${API_SCHEME};
        proxy_cache off;

        # Match Express's bounded 5 MiB parser only for checker ingestion.
        # Proxy headers/resolver are inherited; other API routes retain 1 MiB.
        location ~* ^/api/internal/sync/department/?$ {
            client_max_body_size 5m;
            set $backend http://backend:3000;
            proxy_pass $backend;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
